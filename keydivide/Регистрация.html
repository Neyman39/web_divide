<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Ubuntu+Sans+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>KeyDivide Регистрация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="assets/css/stylesRegistr.css">
</head>
<body>
    <div id="terminal-screen" class="terminal-screen">
      <div class="terminal-container">
          <div class="prompt_tab">
              <p class="prompt">KeyDivide Prompt REV[01]</p>
          </div>
          <div id="terminal" class="terminal1"></div>
      </div>
    </div>
    <div class="authorization">
    <div class="terminal">
      <div class="header_code">
        <a href="Главная.html"><span class="icon red"></span></a>
        <span class="icon yellow"></span>
        <span class="icon green"></span>
        <h2>Регистрация.json</h2>
      </div>
      <div class="json_style">
        <form class="form-box" id="registrationForm">
            <input type="text" id="login" name="login" placeholder="Введите логин" > 
            <input type="text" id="email" name="email" placeholder="Введите Email" >
            <input type="text" id="surname" name="surname" placeholder="Введите фамилию" >
            <input type="text" id="name" name="name" placeholder="Введите имя" >
            <div class="password_container">
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                <span class="password-toggle" onclick="togglePassword()">&#128065;</span>
            </div>
            <input type="password" id="password2" name="password2" placeholder="Повторите пароль" required>
            <div id="message"></div>
            <div class="butt"><button type="submit"> Зарегистироваться </button></div> 
            <a href="Авторизация.html"><div class="forbutt"> Назад </div></a>        
        </form>
      </div>
    </div>
  </div>
    
<script>
  function isValidEmail(email) {
    // Простое, но достаточно надёжное регулярное выражение для email
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
  }
      
  document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
  
    const login = document.getElementById('login').value.trim();
    const email = document.getElementById('email').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const name = document.getElementById('name').value.trim();
    const password = document.getElementById('password').value.trim();
    const password2 = document.getElementById('password2').value.trim();

    const messageEl = document.getElementById('message');

    if (!isValidEmail(email)) {
      messageEl.textContent = 'Некорректный формат email';
      messageEl.style.color = 'red';
      return;
    }
  
    if (password !== password2) {
      messageEl.textContent = 'Пароли не совпадают';
      messageEl.style.color = 'red';
      return;
    }
  
    try {
        const response = await fetch('http://localhost:5000/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            login,
            email,
            surname,
            name,
            password
          }),
        });

        const data = await response.json();

        if (response.ok) {
          // Регистрация успешна
          localStorage.setItem('authToken', data.login);
          localStorage.setItem('userData', JSON.stringify(data));
          typeLine();
          // window.location.href = 'Главная.html';
        } 
        
        else {
          document.getElementById('message').textContent = data.error || 'Ошибка регистрации';
          document.getElementById('message').style.color = 'red';
        }
    } 
    catch (error) {
      console.error('Ошибка:', error);
      console.error('Тип ошибки:', error.name);
      console.error('Сообщение:', error.message);
      document.getElementById('message').textContent = 'Ошибка соединения с сервером: ' + error.message;
      document.getElementById('message').style.color = 'red';
    }
    });
</script>
<script src="./assets/scripts/welcome_terminal.js"></script>
</body>
</html>
