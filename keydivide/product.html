<script>
// Получаем ID продукта из URL
function getProductIdFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id') || 1; // По умолчанию ID 1, если не указан
}

// Основная функция загрузки данных продукта
async function loadProductData() {
    const productId = getProductIdFromUrl();
    
    try {
        const response = await fetch(`/api/products/${productId}`);
        if (!response.ok) {
            throw new Error('Product not found');
        }
        
        const productData = await response.json();
        renderProductPage(productData);

         // Затем загружаем свитчи отдельно
        await loadSwitchesData(productId);
        
    } catch (error) {
        console.error('Error loading product:', error);
        document.getElementById('productName').textContent = 'Товар не найден';
    }
}

// Загрузка данных о свитчах
async function loadSwitchesData(productId) {
    try {
        const switchesResponse = await fetch(`/api/products/${productId}/switches`);
        if (!switchesResponse.ok) {
            throw new Error('Switches not found');
        }
        
        currentSwitchesData = await switchesResponse.json();
        renderSwitches(currentSwitchesData.available_switches);
        setupEventListeners(currentSwitchesData);
        
        // // Устанавливаем свитч по умолчанию
        // const defaultSwitch = currentSwitchesData.available_switches.find(sw => sw.is_default);
        // if (defaultSwitch) {
        //     selectedSwitchId = defaultSwitch.id;
        //     updatePriceDisplay(defaultSwitch.total_price);
        // }
        
    } catch (error) {
        console.error('Error loading switches:', error);
        document.getElementById('switchesContainer').innerHTML = '<p>Ошибка загрузки переключателей</p>';
    }
}

// Рендеринг данных на странице
function renderProductPage(data) {
    // Основная информация
    document.getElementById('productName').textContent = data.name;
    document.getElementById('productDescription').textContent = data.description;
    document.getElementById('productPrice').textContent = `${Math.round(data.current_price)} ₽`;
    document.getElementById('terminalTitle').textContent = `${data.name} Info.json`;

    // Изображения
    renderImages(data.images);
    
    // Переключатели
    // renderSwitches(data.available_switches);
    
    // Спецификации в терминале
    renderSpecificationsCode(data.specifications);
    
    // Комплектация в терминале
    renderEquipmentCode(data.equipment);

    // document.getElementById('basePriceInfo').textContent = 
    //     `Базовая цена: ${Math.round(data.base_price)} ₽ + переключатели`;
}

// Рендер изображений
function renderImages(images) {
    if (images.length === 0) return;
    
    const mainImage = document.getElementById('mainImage');
    mainImage.src = images[0].url;
    mainImage.alt = images[0].alt;
    
    // Миниатюры для десктопа
    const desktopThumbnails = document.getElementById('desktopThumbnails');
    const phoneThumbnails = document.getElementById('phoneThumbnails');
    
    desktopThumbnails.innerHTML = '';
    phoneThumbnails.innerHTML = '';
    
    images.forEach((image, index) => {
        const thumbnail = document.createElement('img');
        thumbnail.src = image.url;
        thumbnail.alt = image.alt;
        thumbnail.className = 'thumbnail' + (index === 0 ? ' active' : '');
        thumbnail.onclick = () => changeMainImage(image.url, image.alt, index);
        
        desktopThumbnails.appendChild(thumbnail.cloneNode(true));
        phoneThumbnails.appendChild(thumbnail);
    });
}

// Рендер переключателей
function renderSwitches(switches) {
    const container = document.getElementById('switchesContainer');
    container.innerHTML = '';

    if (switches.length === 0) {
        container.innerHTML = '<p>Нет доступных переключателей</p>';
        return;
    }
    
    switches.forEach(sw => {
        const button = document.createElement('button');
        button.className = 'config-button';
        button.setAttribute('data-config', sw.id);
        button.setAttribute('data-price', sw.total_price);
        
        button.innerHTML = `
            <div class="swbox">${sw.name}
                <div class="switch__overlay">
                    <div class="switch__inner">
                        <div class="switch__info">
                            <div class="switch__image">
                                <img src="assets/images/${getSwitchImage(sw.name)}.png" alt="${sw.name}" width="80" height="80">
                            </div>
                            <div class="switch__title">
                                <p class="switch__name">${sw.name}</p>
                                <div class="switch__type">${sw.type}</div>
                            </div>
                        </div>
                        <div class="swith__specs">
                            <div class="spec__line"><p>Сила срабатывания</p><p>${sw.actuation_force}g</p></div>
                            <div class="li_line"></div>
                            <div class="spec__line"><p>Сила до упора</p><p>${sw.bottom_force}g</p></div>
                            <div class="li_line"></div>
                            <div class="spec__line"><p>Сила тактильности</p><p>${sw.tactile_force || 'none'}</p></div>
                            <div class="li_line"></div>
                            <div class="spec__line"><p>Длина пути</p><p>${sw.travel_length}</p></div>
                            <div class="li_line"></div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        if (sw.is_default) {
            button.style.border = '1.5px solid rgb(255, 122, 105)';
        }
        
        container.appendChild(button);
    });
}

// Вспомогательная функция для получения изображения свитча
function getSwitchImage(switchName) {
    const images = {
        'Akko V3 Cream Yellow': 'akko-yellow',
        'Akko V3 Cream Blue': 'akko-blue',
        'Outemu Silent Peach': 'outemu-peach'
    };
    return images[switchName] || 'default-switch';
}

// Рендер спецификаций в терминале
function renderSpecificationsCode(specs) {
    const codeElement = document.getElementById('specificationsCode');
    let code = '"specifications": {\n';
    
    specs.forEach(spec => {
        code += `    <span class="key1">"${spec.key}"</span>: <span class="value1">"${spec.value}"</span>,\n`;
    });
    
    code = code.slice(0, -2) + '\n}'; // Убираем последнюю запятую
    codeElement.innerHTML = code;
}

// Рендер комплектации в терминале
function renderEquipmentCode(equipment) {
    const codeElement = document.getElementById('equipmentCode');
    let code = '"equipment": [\n';
    
    equipment.forEach(item => {
        code += `    <span class="key1">"${item}"</span>,\n`;
    });
    
    code = code.slice(0, -2) + '\n]'; // Убираем последнюю запятую
    codeElement.innerHTML = code;
}

// Смена основного изображения
function changeMainImage(src, alt, index) {
    const mainImage = document.getElementById('mainImage');
    mainImage.src = src;
    mainImage.alt = alt;
    
    // Обновляем активные миниатюры
    document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
        thumb.classList.toggle('active', i === index);
    });
}

// Настройка обработчиков событий
function setupEventListeners(data) {
    // Обработчики для кнопок переключателей
    document.querySelectorAll('.config-button').forEach(button => {
        button.addEventListener('click', function() {
            const switchId = this.getAttribute('data-config');
            const newPrice = this.getAttribute('data-price');
            
            // Обновляем цену
            document.getElementById('productPrice').textContent = `${Math.round(newPrice)} ₽`;
            
            // Обновляем рамки кнопок
            document.querySelectorAll('.config-button').forEach(btn => {
                btn.style.border = '1.5px solid rgb(96, 96, 96)';
            });
            this.style.border = '1.5px solid rgb(255, 122, 105)';
            
            // Обновляем спецификацию "Переключатели"
            updateSwitchSpecification(switchId, data.available_switches);
        });
    });
    
    // Обработчики для слайдера
    setupSliderControls();
}

function updateSwitchSpecification(switchId, switches) {
    const selectedSwitch = switches.find(sw => sw.id == switchId);
    if (!selectedSwitch) return;
    
    const switchValue = `${selectedSwitch.name} (${selectedSwitch.type} ${selectedSwitch.actuation_force}г.)`;
    
    // Получаем все строки спецификаций
    const specs = document.querySelectorAll('#specificationsCode .value1');
    
    // Предположим, что "Переключатели" всегда на 3-й позиции (индекс 2)
    if (specs.length > 3) {
        const switchSpec = specs[2];
        const valueElement = switchSpec.nextElementSibling.nextElementSibling;
        if (valueElement) {
            valueElement.textContent = `"${switchValue}"`;
        }
    }
    
    // // Обновляем в списке характеристик
    // const specItems = document.querySelectorAll('#specificationsList .haracter');
    // specItems.forEach(item => {
    //     const keyElement = item.querySelector('.spectext');
    //     if (keyElement.textContent === 'Переключатели') {
    //         const valueElement = item.querySelector('.spectext2');
    //         valueElement.textContent = switchValue.toLowerCase();
    //     }
    // });
}

// Настройка управления слайдером
function setupSliderControls() {
    let currentImageIndex = 0;
    const thumbnails = document.querySelectorAll('.thumbnail');
    
    document.querySelector('.next-btn').addEventListener('click', () => {
        currentImageIndex = (currentImageIndex + 1) % thumbnails.length;
        thumbnails[currentImageIndex].click();
    });
    
    document.querySelector('.prev-btn').addEventListener('click', () => {
        currentImageIndex = (currentImageIndex - 1 + thumbnails.length) % thumbnails.length;
        thumbnails[currentImageIndex].click();
    });
}

// Загрузка при старте
document.addEventListener('DOMContentLoaded', () => {
    loadProductData();
    // Ваши существующие скрипты авторизации и корзины
    // checkAuthAndDisplayUser();
    setupCartButton();
});

// Функция для кнопки корзины (работа с сервером)
function setupCartButton() {
    document.getElementById('addToCartBtn')?.addEventListener('click', async () => {
        const userId = localStorage.getItem('userId');
        if (!userId) {
            alert('Пожалуйста, войдите в аккаунт, чтобы добавлять товары в корзину.');
            window.location.href = 'Авторизация.html';
            return;
        }

        const productId = getProductIdFromUrl();

        // Определяем выбранный свитч по активной кнопке (рамка rgb(255,122,105))
        const activeButton = document.querySelector('.config-button[style*="rgb(255, 122, 105)"]');
        let switchId = null;
        if (activeButton) {
            switchId = activeButton.getAttribute('data-config');
        }

        // Количество пока фиксированное = 1, позже можно добавить счётчик
        const quantity = 1;

        try {
            const response = await fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: parseInt(userId),
                    productId: productId,
                    switchId: switchId || null,
                    quantity: quantity
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Ошибка при добавлении в корзину');
            }
            alert('Товар добавлен в корзину!');
        } catch (err) {
            console.error('Ошибка:', err);
            alert('Ошибка: ' + err.message);
        }
    });
}
