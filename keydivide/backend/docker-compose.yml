version: '3.8'

services:
  # Почтовый сервер для тестов (веб-интерфейс на порту 8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: shop_mailpit
    ports:
      - "8025:8025"  # Веб-интерфейс
      - "1025:1025"  # SMTP-порт
    restart: unless-stopped
    environment:
      - MP_MAX_MESSAGES=100
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1 