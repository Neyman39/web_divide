<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Профиль | KeyDivide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/navpanel.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header id="nav_header"></header>
<header id="header-phone"></header>

<div class="box">
  <div class="user_card">
    <div class="user_info">
      <img src="assets/images/sw_pink.png" alt="Аватар" width="80" height="80" style="border-radius: 50%" />
      <div class="data">
        <h1 id="username"></h1>
        <p id="userphone"></p>
        <p id="useremail"></p>
        <p id="useraddress"></p>
      </div>
    </div>
    <div class="orders_info">
      <p><button id="logoutBtn" class="logout">Выйти</button></p>
    </div>
  </div>

  <div class="myorders">
    <h2 style="text-align:center; margin-bottom: 5px;">Мои заказы</h2>
    <div id="ordersSection">
      <div class="empty-orders">У вас пока нет заказов.</div>
    </div>
  </div>
  
</div>

<footer id="footer"></footer>

<script src="assets/scripts/initMobileNavigation.js"></script>
<script src="assets/scripts/check_authorization.js"></script>
<script src="assets/scripts/components.js"></script>
<script>
    // Загружаем компоненты при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        loadComponent('nav_header', 'nav_header');
        loadComponent('footer', 'footer');
        loadComponent('header-phone', 'header-phone');
        initMobileNavigation();
    });
</script>

<script>
  // Вспомогательная функция получения userId
  function getUserId() {
    return localStorage.getItem('userId');
  }

  // Форматирование даты
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString('ru-RU');
  }

  // Получение текста статуса на русском
  function getStatusText(status) {
    const statuses = {
      'pending': 'Ожидает обработки',
      'confirmed': 'Подтверждён',
      'cancelled': 'Отменён'
    };
    return statuses[status] || status;
  }

  window.onload = async function () {
    try {
      // Проверяем авторизацию через JWT (credentials: 'include' для куки)
      const authResp = await fetch('/check-auth', {
        credentials: 'include'
      });

      if (!authResp.ok) {
        alert('Пожалуйста, войдите в аккаунт.');
        window.location.href = 'Авторизация.html';
        return;
      }

      const { user } = await authResp.json();
      
      if (!user) {
        alert('Данные пользователя не найдены.');
        window.location.href = 'Авторизация.html';
        return;
      }

      // Заполняем профиль пользователя
      document.getElementById('username').textContent = user.name || user.login || 'Пользователь';
      document.getElementById('userphone').textContent = `Телефон: ${user.phone || '-'}`;
      document.getElementById('useremail').textContent = `Email: ${user.email || '-'}`;
      document.getElementById('useraddress').textContent = `Адрес: ${user.address || '-'}`;

      // Загружаем заказы с сервера
      const ordersSection = document.getElementById('ordersSection');
      
      try {
        const ordersResp = await fetch(`/api/orders?userId=${user.id}`, {
          credentials: 'include'
        });
        
        if (!ordersResp.ok) throw new Error('Ошибка загрузки заказов');
        
        const orders = await ordersResp.json();

        if (!orders || orders.length === 0) {
          ordersSection.innerHTML = `<div class="empty-orders">У вас пока нет заказов.</div>`;
          return;
        }

        let html = '';
        orders.forEach(order => {
          const orderDate = formatDate(order.created_at);
          html += `
            <div class="order-card" style="margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; padding: 15px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <strong>Заказ №${order.id}</strong>
                <span style="color: gray;">${orderDate}</span>
                <span>Статус: <em>${getStatusText(order.status)}</em></span>
              </div>
              <table style="width:100%; border-collapse: collapse;">
                <tr>
                  <th>Товар</th>
                  <th>Переключатель</th>
                  <th>Количество</th>
                  <th>Цена за шт.</th>
                  <th>Сумма</th>
                </tr>`;
          
          if (order.items && order.items.length > 0) {
            order.items.forEach(item => {
              const itemTotal = (parseFloat(item.unit_price) * item.quantity).toLocaleString('ru-RU');
              html += `
                <tr>
                  <td>${item.product_name || 'Товар'}</td>
                  <td>${item.switch_name || '-'}</td>
                  <td>${item.quantity}</td>
                  <td>${parseFloat(item.unit_price).toLocaleString('ru-RU')} ₽</td>
                  <td>${itemTotal} ₽</td>
                </tr>`;
            });
          }
          
          html += `
              </table>
              <div style="text-align: right; margin-top: 5px; font-weight: bold;">
                Итого: ${order.total ? order.total.toLocaleString('ru-RU') : '0'} ₽
              </div>
            </div>`;
        });
        
        ordersSection.innerHTML = html;
        
      } catch (ordersErr) {
        console.error('Ошибка загрузки заказов:', ordersErr);
        ordersSection.innerHTML = `<div class="empty-orders">Ошибка при загрузке заказов: ${ordersErr.message}</div>`;
      }

    } catch (authErr) {
      console.error('Ошибка авторизации:', authErr);
      alert('Ошибка при проверке авторизации.');
      window.location.href = 'Авторизация.html';
    }
  };

  // Выход из системы
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
      await fetch('/logout', {
        method: 'POST',
        credentials: 'include'
      });
    } catch (e) {
      console.error('Ошибка при выходе:', e);
    }
    
    // Очищаем локальное хранилище
    localStorage.removeItem('userId');
    localStorage.removeItem('authToken');
    localStorage.removeItem('userData');
    
    // Очищаем все корзины пользователя
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('cart_')) localStorage.removeItem(key);
    });
    
    alert('Вы вышли из аккаунта.');
    window.location.href = 'Главная.html';
  });
</script>

</body>
</html>
